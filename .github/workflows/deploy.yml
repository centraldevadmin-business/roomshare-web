# Builds the app and publishes it to Cloudflare Pages.
# Runs on every push to main. The output is a static PWA — no server needed.

name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          VITE_GITHUB_USER: ${{ secrets.VITE_GITHUB_USER }}
          VITE_GITHUB_REPO: ${{ secrets.VITE_GITHUB_REPO }}
          VITE_WORKER_URL: ${{ secrets.VITE_WORKER_URL }}
          VITE_HOUSE_PASSWORD: ${{ secrets.VITE_HOUSE_PASSWORD }}
        run: npm run build

      - name: Deploy to Cloudflare Pages
        # cloudflare/pages-action does not exist — that reference made every
        # deploy fail with "Unable to resolve action". wrangler-action@v4 is
        # Cloudflare's official action and supports `pages deploy`.
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy ./dist --project-name=${{ secrets.CLOUDFLARE_PROJECT_NAME }}
